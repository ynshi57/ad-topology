<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI News — Follow Builders 信息源</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2230; --border: #2b323c;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --x: #1d9bf0; --pod: #f2994a; --blog: #a371f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.6 -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-rows: 52px 44px 1fr; height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 0 18px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { margin-left: auto; }
  .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
         border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .tabs { display: flex; align-items: center; gap: 6px; padding: 0 18px;
          background: var(--panel); border-bottom: 1px solid var(--border); }
  .tab { padding: 6px 14px; cursor: pointer; border-radius: 6px 6px 0 0; color: var(--muted);
         font-size: 13px; border: 1px solid transparent; border-bottom: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); background: var(--panel2); border-color: var(--border); }
  .tab .cnt { color: var(--muted); font-size: 11px; margin-left: 5px; }
  #content { overflow-y: auto; padding: 16px 18px 40px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
          padding: 12px 14px; margin: 0 auto 10px; max-width: 860px; }
  .card .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .card .name { font-weight: 600; font-size: 13.5px; }
  .card .handle { color: var(--muted); font-size: 11.5px; }
  .card .bio { color: var(--muted); font-size: 11px; margin: 2px 0 8px; white-space: pre-wrap; }
  .tweet { border-left: 2px solid var(--x); padding: 4px 0 4px 10px; margin: 8px 0; }
  .tweet .txt { white-space: pre-wrap; word-break: break-word; }
  .tweet .foot { color: var(--muted); font-size: 11px; margin-top: 4px; display: flex; gap: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px;
          font-weight: 600; color: #fff; }
  .dim { color: var(--muted); font-size: 11.5px; }
  .empty, .loading { color: var(--muted); text-align: center; padding: 60px 20px; }
  .err { color: #eb5757; background: rgba(235,87,87,.08); border: 1px solid rgba(235,87,87,.3);
         border-radius: 6px; padding: 8px 12px; margin: 0 auto 12px; max-width: 860px; font-size: 12px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AI News</h1>
    <span class="meta" id="meta">Follow Builders · 数据来自公开 feed</span>
    <span class="spacer"></span>
    <button class="btn" id="btn-summary" disabled title="接入 LLM 后启用">生成摘要 (即将支持)</button>
    <button class="btn" id="btn-refresh">刷新</button>
  </header>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="x">X / Twitter<span class="cnt" id="cnt-x"></span></div>
    <div class="tab" data-tab="podcasts">Podcasts<span class="cnt" id="cnt-podcasts"></span></div>
    <div class="tab" data-tab="blogs">Blogs<span class="cnt" id="cnt-blogs"></span></div>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div>加载中...</div></div>
</div>

<script type="module">
// follow-builders 公开 feed（https://github.com/zarazhangrui/follow-builders）
const REPO_RAW = 'https://raw.githubusercontent.com/zarazhangrui/follow-builders/main';
const FEEDS = {
  x: `${REPO_RAW}/feed-x.json`,
  podcasts: `${REPO_RAW}/feed-podcasts.json`,
  blogs: `${REPO_RAW}/feed-blogs.json`,
};
// 复用 ad-topology 后端的 /proxy 端点绕开 CORS / 网络限制，与前端 URL 加载流程一致。
const PROXY_BASE = 'http://localhost:8765/proxy?url=';

const state = { x: null, podcasts: null, blogs: null, errors: {}, tab: 'x', generatedAt: null };

const contentEl = document.getElementById('content');
const metaEl = document.getElementById('meta');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 把 t.co 短链渲染成可点击链接，其余文本转义。
function linkify(text) {
  const safe = esc(text);
  return safe.replace(/(https?:\/\/[^\s]+)/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
function fmtTime(iso) {
  if (!iso) { return ''; }
  const d = new Date(iso);
  if (isNaN(d.getTime())) { return ''; }
  return d.toLocaleString();
}
function num(n) { return typeof n === 'number' ? n.toLocaleString() : '0'; }

async function fetchFeed(key) {
  const res = await fetch(PROXY_BASE + encodeURIComponent(FEEDS[key]));
  if (!res.ok) { throw new Error(`HTTP ${res.status}`); }
  return res.json();
}

async function loadAll() {
  contentEl.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
  state.errors = {};
  const keys = ['x', 'podcasts', 'blogs'];
  // fail-soft：单个 feed 失败不影响其他 feed 渲染。
  const results = await Promise.allSettled(keys.map(fetchFeed));
  results.forEach((r, i) => {
    const key = keys[i];
    if (r.status === 'fulfilled') {
      state[key] = r.value;
      if (r.value?.generatedAt) { state.generatedAt = r.value.generatedAt; }
    } else {
      state[key] = null;
      state.errors[key] = r.reason?.message || String(r.reason);
    }
  });
  updateCounts();
  render();
}

function updateCounts() {
  document.getElementById('cnt-x').textContent = state.x?.x ? `(${state.x.x.length})` : '';
  document.getElementById('cnt-podcasts').textContent = state.podcasts?.podcasts ? `(${state.podcasts.podcasts.length})` : '';
  document.getElementById('cnt-blogs').textContent = state.blogs?.blogs ? `(${state.blogs.blogs.length})` : '';
  metaEl.textContent = state.generatedAt
    ? `Follow Builders · feed 更新于 ${fmtTime(state.generatedAt)}`
    : 'Follow Builders · 数据来自公开 feed';
}

function errBanner(key) {
  if (!state.errors[key]) { return ''; }
  return `<div class="err">加载失败：${esc(state.errors[key])}。请确认 ad-topology 后端 (node server/index.js) 正在运行。</div>`;
}

function renderX() {
  const parts = [errBanner('x')];
  const builders = state.x?.x || [];
  if (!state.errors.x && !builders.length) { parts.push('<div class="empty">过去 24 小时没有新推文</div>'); }
  for (const b of builders) {
    if (!b.tweets?.length) { continue; }
    const tweets = b.tweets.map((t) => `
      <div class="tweet">
        <div class="txt">${linkify(t.text)}</div>
        <div class="foot">
          <a href="${esc(t.url)}" target="_blank" rel="noopener">原文</a>
          <span>${fmtTime(t.createdAt)}</span>
          <span>♥ ${num(t.likes)}</span>
          <span>↻ ${num(t.retweets)}</span>
          <span>💬 ${num(t.replies)}</span>
        </div>
      </div>`).join('');
    parts.push(`
      <div class="card">
        <div class="top">
          <span class="pill" style="background:var(--x)">X</span>
          <span class="name">${esc(b.name)}</span>
          <span class="handle">@${esc(b.handle)}</span>
        </div>
        ${b.bio ? `<div class="bio">${esc(b.bio)}</div>` : ''}
        ${tweets}
      </div>`);
  }
  return parts.join('');
}

function renderPodcasts() {
  const parts = [errBanner('podcasts')];
  const pods = state.podcasts?.podcasts || [];
  if (!state.errors.podcasts && !pods.length) { parts.push('<div class="empty">最近没有新播客节目</div>'); }
  for (const p of pods) {
    parts.push(`
      <div class="card">
        <div class="top">
          <span class="pill" style="background:var(--pod)">Podcast</span>
          <span class="name">${esc(p.name)}</span>
          <span class="dim">${fmtTime(p.publishedAt)}</span>
        </div>
        <div style="margin:4px 0"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></div>
        <div class="dim">含逐字稿 · 摘要功能接入 LLM 后可用</div>
      </div>`);
  }
  return parts.join('');
}

function renderBlogs() {
  const parts = [errBanner('blogs')];
  const blogs = state.blogs?.blogs || [];
  if (!state.errors.blogs && !blogs.length) { parts.push('<div class="empty">最近没有新博客文章</div>'); }
  for (const b of blogs) {
    parts.push(`
      <div class="card">
        <div class="top">
          <span class="pill" style="background:var(--blog)">Blog</span>
          <span class="name">${esc(b.name)}</span>
          ${b.author ? `<span class="dim">${esc(b.author)}</span>` : ''}
          <span class="dim">${fmtTime(b.publishedAt)}</span>
        </div>
        <div style="margin:4px 0"><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a></div>
        ${b.description ? `<div class="bio">${esc(b.description)}</div>` : ''}
      </div>`);
  }
  return parts.join('');
}

function render() {
  if (state.tab === 'x') { contentEl.innerHTML = renderX(); }
  else if (state.tab === 'podcasts') { contentEl.innerHTML = renderPodcasts(); }
  else { contentEl.innerHTML = renderBlogs(); }
  contentEl.scrollTop = 0;
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) { return; }
  state.tab = tab.dataset.tab;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
  render();
});
document.getElementById('btn-refresh').addEventListener('click', loadAll);

loadAll();
</script>
</body>
</html>
